<!DOCTYPE html>
<html>
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }}</title>

    {% include meta.html %}

    <!--[if lt IE 9]>
      <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/images/favicon/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/images/favicon/favicon-32.png" />
    <link rel="apple-touch-icon" href="{{ site.baseurl }}/images/favicon/apple-touch-icon.png" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />

    <!-- Created with Jekyll Now - http://github.com/barryclark/jekyll-now -->
  </head>

  <body>
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead clearfix">
          <a href="{{ site.baseurl }}/pd2af/" class="site-avatar"><img src="{{ site.avatar }}" /></a>

          <div class="site-info">
            <h1 class="site-name"><a href="{{ site.baseurl }}/pd2af/">{{ site.name }}</a></h1>
            <p class="site-description">working pages, not linked from the official site</p>
          </div>

          <nav>
            <a href="{{ site.baseurl }}/pd2af/">Working pages</a>
            <a href="{{ site.baseurl }}/pd2af/rules/">Rules (draft)</a>
            <a href="{{ site.baseurl }}/pd2af/specification/">Specification (working copy)</a>
            <a href="{{ site.baseurl }}/">Official site</a>
          </nav>
        </header>
      </div>
    </div>

    <div id="main" role="main" class="container">
      {{ content }}
    </div>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>

    {% include analytics.html %}
  </body>
</html>
